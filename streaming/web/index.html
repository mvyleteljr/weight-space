<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weight Space</title>
  <link rel="stylesheet" href="/style.css"><script src="/status.js" defer></script><script src="/app.js" defer></script>
</head>
<body>
  <main>
    <section class="arena" aria-label="Live match">

      <div class="screen"><canvas id="arena" width="1000" height="600" aria-label="Game"></canvas><iframe id="player" hidden title="Street Fighter live video" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>
      <div class="controls" id="controls">
        <div class="control-row">
          <button id="start" disabled>Initializing…</button>
          <label>Speed <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
          <button id="reset">Reset</button>
          <span id="status" role="status">Initializing…</span>
        </div>
      </div>
    </section>
    <section class="run-overview" aria-label="Training score">
      <div class="run-panel">
        <div class="scoreboard" aria-label="Run tally" role="status"><div><span id="score-name-1">Astra</span><strong id="score-1">0</strong></div><span class="versus">VS</span><div><span id="score-name-2">Opus 5.5</span><strong id="score-2">0</strong></div></div>

      </div>
      <p id="tally-note" class="tally-note">0 games · 0 draws</p>

    </section>



    <section class="reply-section" aria-labelledby="reply-title">
      <h2 id="reply-title">Model updates</h2>
      <div id="replies" class="reply-grid"></div>
    </section>
  </main>

</body>
</html>
